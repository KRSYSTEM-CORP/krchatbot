name: Drain outbound queue

# /api/cron necesita dispararse cada minuto (drena la cola de mensajes
# salientes, reactiva chats en snooze vencido, arranca envíos programados),
# pero el plan de Vercel usado aquí sólo permite cron nativo una vez al día.
# Este workflow hace ese trabajo en su lugar — ver app/api/cron/route.ts.
#
# GitHub Actions no garantiza el minuto exacto bajo carga alta de la
# plataforma, pero en la práctica dispara cerca del horario — muy por encima
# de "esperar a que alguien mande un mensaje en otro chat por coincidencia",
# que es como funcionaba antes de esto.

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch: {}

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Llamar a /api/cron
        run: |
          code=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://krchatbot.krsystem-corp.com/api/cron)
          echo "HTTP $code"
          cat /tmp/response.json
          if [ "$code" -ge 300 ]; then
            exit 1
          fi
